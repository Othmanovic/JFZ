<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sea Port Management System</title>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>Login</h1>
            <form (ngSubmit)="login()" #loginForm="ngForm">
              <div class="textbox">
                  <input type="text" placeholder="Username" name="username" [(ngModel)]="username" required>
              </div>
              <div class="textbox">
                  <input type="password" placeholder="Password" name="password" [(ngModel)]="password" required>
              </div>
              <button type="submit" class="btn">Login</button>
          </form>
        </div>
    </div>
</body>
</html>
