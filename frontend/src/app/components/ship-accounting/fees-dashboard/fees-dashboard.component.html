<div class="fees-container">
  <h2>إدارة الرسوم البحرية</h2>

  <form (ngSubmit)="addFee()" #feeForm="ngForm" class="fee-form">
    <div class="form-group">
      <label for="label">البيان</label>
      <input
        type="text"
        id="label"
        name="label"
        [(ngModel)]="newFee.label"
        required
        placeholder="أدخل اسم الرسوم"
      />
    </div>

    <div class="form-group">
      <label for="rate">التعريفة</label>
      <input
        type="number"
        id="rate"
        name="rate"
        [(ngModel)]="newFee.rate"
        required
        placeholder="أدخل قيمة الرسوم"
      />
    </div>

    <button type="submit">إضافة</button>
  </form>

  <table class="fees-table">
    <thead>
      <tr>
        <th>البيان</th>
        <th>التعريفة</th>
        <th>الإجراءات</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let fee of seaFees">
        <td>{{ fee.label }}</td>
        <td>{{ fee.rate }}</td>
        <td>
          <button (click)="editFee(fee)">تعديل</button>
          <button (click)="deleteFee(fee.id)">حذف</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
